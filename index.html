<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05010f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEON STRIKER" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="네온 아케이드 우주 슈팅 미니게임. 한 손가락 드래그와 자동 연사로 웨이브를 돌파하고 보스를 격파하세요. 아이폰 사파리와 PC 모두 지원." />
<title>NEON STRIKER · 네온 아케이드 슈팅</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305010f'/%3E%3Cpath d='M32 10 L46 46 L32 38 L18 46 Z' fill='%2322e6ff'/%3E%3Cpath d='M32 26 L38 44 L32 41 L26 44 Z' fill='%23ff3cbe'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="NEON STRIKER 게임 화면"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hud hud-hidden">
    <div class="hud-top">
      <div class="stat">
        <span class="stat-label">점수</span>
        <span id="hud-score" class="stat-value">0</span>
        <span class="stat-sub">최고 <b id="hud-best">0</b></span>
      </div>
      <div class="stat stat-mid">
        <span class="stat-label">웨이브</span>
        <span id="hud-wave" class="stat-value">1</span>
      </div>
      <div class="hud-actions">
        <button id="btn-mute" class="icon-btn" type="button" aria-label="소리 켜기/끄기">
          <span id="mute-icon" aria-hidden="true">🔊</span>
        </button>
        <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지">
          <span aria-hidden="true">❚❚</span>
        </button>
      </div>
    </div>

    <div id="boss-bar" class="boss-bar hidden" aria-hidden="true">
      <div class="boss-bar-head">
        <span class="boss-bar-label">BOSS</span>
        <span id="boss-bar-hp" class="boss-bar-hp"></span>
      </div>
      <div class="boss-bar-track"><div id="boss-bar-fill" class="boss-bar-fill"></div></div>
    </div>

    <div class="hud-bottom">
      <div id="hud-hearts" class="hearts" aria-label="남은 기체"></div>
      <div class="hud-combo"><span id="hud-combo" class="combo"></span></div>
      <button id="btn-bomb" class="bomb-btn" type="button" aria-label="필살기 폭탄 사용">
        <span class="bomb-ico" aria-hidden="true">💣</span>
        <span id="hud-bombs" class="bomb-count">0</span>
      </button>
    </div>
  </div>

  <!-- ================= 시작 화면 ================= -->
  <div id="screen-start" class="screen">
    <div class="screen-inner">
      <div class="logo">
        <div class="logo-kicker">NEON ARCADE</div>
        <h1 class="logo-title">NEON<span>STRIKER</span></h1>
        <div class="logo-line"></div>
      </div>
      <p class="tagline">
        한 손가락으로 조종하고, 자동 연사로 쏟아부어라.<br />
        웨이브를 넘길수록 보스가 기다린다.
      </p>
      <div class="best-card">
        <span class="best-label">최고 기록</span>
        <strong id="start-best" class="best-value">0</strong>
      </div>
      <button id="btn-start" class="btn-primary" type="button">시작하기</button>

      <ul class="howto">
        <li><b>📱 모바일</b><span>화면을 한 손가락으로 드래그</span></li>
        <li><b>🖥 PC</b><span>마우스 이동 · 방향키 / WASD</span></li>
        <li><b>💣 필살기</b><span>💣 버튼 또는 Space</span></li>
      </ul>
      <div class="start-foot">자동 연사 · 아이템 강화 · 최고 기록 도전</div>
    </div>
  </div>

  <!-- ================= 일시정지 ================= -->
  <div id="screen-pause" class="screen hidden">
    <div class="screen-inner">
      <div class="panel">
        <h2>일시정지</h2>
        <div class="panel-stats">
          <div><span>점수</span><b id="pause-score">0</b></div>
          <div><span>웨이브</span><b id="pause-wave">1</b></div>
        </div>
        <button id="btn-resume" class="btn-primary" type="button">계속하기</button>
        <button id="btn-restart" class="btn-ghost" type="button">다시 시작</button>
      </div>
    </div>
  </div>

  <!-- ================= 게임 오버 ================= -->
  <div id="screen-over" class="screen hidden">
    <div class="screen-inner">
      <div class="panel panel-over">
        <div class="over-label">GAME OVER</div>
        <div class="over-score">
          <span>점수</span>
          <strong id="over-score">0</strong>
        </div>
        <div class="over-meta">
          <div><span>최고 기록</span><b id="over-best">0</b></div>
          <div><span>도달 웨이브</span><b id="over-wave">1</b></div>
        </div>
        <div id="new-record" class="new-record hidden">NEW RECORD!</div>
        <button id="btn-again" class="btn-primary" type="button">다시 하기</button>
        <button id="btn-menu" class="btn-ghost" type="button">처음으로</button>
      </div>
    </div>
  </div>

  <noscript><div class="noscript">이 게임을 하려면 JavaScript를 켜 주세요.</div></noscript>
</div>

<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
